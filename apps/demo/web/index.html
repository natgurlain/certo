<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certo: agents pay instantly, bad calls get refunded</title>
<meta name="description" content="Replay of a real NEAR testnet run: an AI agent pays for an API call, gets the wrong data, and is refunded from the seller's bond after three NEAR AI enclave signatures are verified by the contract.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Certo">
<meta property="og:url" content="https://certo-bice.vercel.app/">
<meta property="og:title" content="Certo: agents pay instantly, bad calls get refunded">
<meta property="og:description" content="Replay of a real NEAR testnet run: an AI agent pays for an API call, gets the wrong data, and is refunded from the seller's bond after three NEAR AI enclave signatures are verified by the contract.">
<meta property="og:image" content="https://certo-bice.vercel.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The Certo replay at the scene 2 verdict: three NEAR AI jurors vote 3–0 for the buyer, each signature verified, 0.40 refunded from the seller's bond">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Certo: agents pay instantly, bad calls get refunded">
<meta name="twitter:description" content="Replay of a real NEAR testnet run: an AI agent pays for an API call, gets the wrong data, and is refunded from the seller's bond after three NEAR AI enclave signatures are verified by the contract.">
<meta name="twitter:image" content="https://certo-bice.vercel.app/og.png">
<meta name="twitter:image:alt" content="The Certo replay at the scene 2 verdict: three NEAR AI jurors vote 3–0 for the buyer, each signature verified, 0.40 refunded from the seller's bond">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <header class="top">
    <div class="brand">
      <div class="brand-name" data-brand="name"></div>
      <div class="brand-tagline" data-brand="tagline"></div>
    </div>
    <ol class="scenes" id="scenes"></ol>
    <div class="mode" id="mode">
      <div class="mode-panel" id="mode-panel">waiting for the demo runner…</div>
      <div class="mode-net" id="mode-net"></div>
    </div>
  </header>

  <div class="caption" id="caption"><span id="caption-text">Connecting to the demo feed…</span><button id="verify" class="verify hidden" type="button" title="Read the contract and the scene 2 transaction from NEAR testnet and check the three juror signatures in this browser">Don't trust this page: verify on NEAR testnet</button></div>

  <main class="lanes">
    <section class="lane lane-buyer">
      <h2>Buyer agents</h2>
      <div id="buyers" class="cards"></div>
      <div id="call" class="callbox"></div>
    </section>
    <section class="lane lane-seller">
      <h2>Sellers</h2>
      <div id="sellers" class="cards"></div>
    </section>
    <section class="lane lane-panel">
      <h2>Panel <span class="h2-note">experimental · three model families, three enclaves</span></h2>
      <div id="case" class="case"></div>
      <div id="jurors" class="jurors"></div>
      <div id="result" class="result"></div>
    </section>
  </main>

  <footer class="bottom">
    <div class="chain">
      <div class="chain-label">Last contract event</div>
      <div class="chain-line"><span id="chain-event" class="chain-event">—</span><span id="chain-data" class="chain-data"></span></div>
      <div class="chain-tx"><span class="chain-label">tx</span> <span id="chain-tx" class="mono"></span></div>
    </div>
    <div class="done-box"><div class="done" id="done"></div><button id="replay" class="replay hidden" type="button" title="Play the run again (R)">↻ Replay</button></div>
  </footer>

  <div id="intro" class="overlay intro"><p data-brand="intro"></p></div>
  <div id="endcard" class="overlay endcard hidden">
    <div class="end-name" data-brand="name"></div>
    <div class="end-line" data-brand="endline"></div>
    <a class="end-repo" id="end-repo" hidden></a>
    <div class="end-built" data-brand="built"></div>
  </div>
  <div id="flyers"></div>
  <div id="verify-panel" class="overlay vpanel hidden" role="dialog" aria-modal="true" aria-label="Verification on NEAR testnet"><div class="vcard" id="verify-card"></div></div>
</div>
<div id="phone" class="phone">
  <div class="phone-name" data-brand="name"></div>
  <div class="phone-tag" data-brand="tagline"></div>
  <p class="phone-note">Best on a desktop: this page is a 1920×1080 replay of the run. Here is what it shows.</p>
  <div class="phone-mode" id="phone-mode"></div>
  <ol class="phone-facts" id="phone-facts"></ol>
  <div class="phone-done" id="phone-done"></div>
  <ul class="phone-links" id="phone-links"></ul>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
