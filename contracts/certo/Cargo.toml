[package]
name = "certo"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Each feature compiles out exactly one guard (docs/DESIGN.md 4.8). Never deploy these.
no_g1 = []  # juror ballot signature check
no_g2 = []  # exposure limit on pay
no_g3 = []  # one dispute per call (status check on dispute)
no_g4 = []  # dispute window check
no_g5 = []  # receipt signature check
no_g6 = []  # bond withdrawal exposure check
no_g7 = []  # evidence hash binding in resolve
no_g8 = []  # prompt binding: trust a supplied request hash
no_g16 = [] # panel timeout pays the midpoint instead of the seller's offer
no_g17 = [] # a split panel pays the midpoint instead of the seller's offer

[dependencies]
near-sdk = "=5.28.3"
near-contract-standards = "=5.28.3"
serde_json = "1"

[dev-dependencies]
near-sdk = { version = "=5.28.3", features = ["unit-testing"] }
near-workspaces = "0.22.2"
tokio = { version = "1", features = ["full"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
anyhow = "1"
futures = "0.3"
